<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinyl Sage</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Album sidebar -->
         <aside class="sidebar">
            <div class="sidebar-header">
                <img src="https://u.cubeupload.com/ffhighwind/vsLogoMain.png" 
                    alt="VinylSage" style="width: 150px; display: block; margin: 0 auto 10px">
            </div>
            <div class="search-wrap">
                <input class="search-input" id="searchInput" placeholder="Search albums..." autocomplete="off">
            </div>
            <div class="album-list" id="albumList"></div>
            <div class="sidebar-footer">
                <span id="albumCount">Loading...</span>
                <span style="font-size: 10px; color: var(--grey); margin-top: 4px; display: block;">
                    Logo credit to @mewindson on Fiverr
            </div>
         </aside>

         <!-- Main Column -->
          <main class="main">
            <div class="main-header">
                <div class="header-title">Ask about your favorite <em>rock classics!</em></div>
                <div class="route-badge" id="routeBadge"></div>
            </div>
            <div class="chat" id="chat"></div>
            <div class="input-area">
                <div class="input-wrap">
                    <textarea id="inputBox" class="input-box" placeholder="Ask about albums, pressings, artists, influences..."></textarea>
                    <button class="send-btn" id="sendBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24">
                            <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
                <div class="input-hint">
                    Try: "Why is Aja landmark?" , "What pressings exist for Led Zeppelin II?" , "Compare Sheer Heart Attack to Night at the Opera"
                </div>
            </div>
          </main>


    </div>
    <script src="app.js"></script>
</body>
</html>
